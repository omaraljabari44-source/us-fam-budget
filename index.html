<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>US FAM BUDGET</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:23px;margin:0}.muted{color:#687386}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border-radius:17px;padding:18px;box-shadow:0 5px 22px #17203310}.big{font-size:28px;font-weight:760;margin-top:6px}.two{display:grid;grid-template-columns:1fr 1.7fr;gap:14px;margin-top:14px}input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid #d9deea;margin-top:8px;font:inherit}button{background:#172033;color:#fff;border:0;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:10px}td,th{text-align:left;padding:10px 5px;border-bottom:1px solid #edf0f5;font-size:14px}.del{width:auto;background:none;color:#b42318;padding:4px}.login{max-width:390px;margin:12vh auto}.hidden{display:none}.notice{font-size:12px;margin-top:12px;color:#687386}@media(max-width:720px){.grid,.two{grid-template-columns:1fr}.wrap{padding:16px}table{display:block;overflow-x:auto}}
</style></head>
<body>
<div id="login" class="wrap login"><div class="card"><h1>US FAM BUDGET</h1><p class="muted">Private family budget</p><input id="name" placeholder="Your name" autocomplete="name"><input id="pin" type="password" placeholder="Family PIN"><button id="enterBtn">Enter</button><p id="err" class="muted"></p><p class="notice">Starter version: data is saved on this browser. Shared family syncing will be connected next.</p></div></div>
<div id="app" class="wrap hidden"><header><div><h1>US FAM BUDGET</h1><span id="hello" class="muted"></span></div><button id="logoutBtn" style="width:auto">Log out</button></header>
<div class="grid"><div class="card"><div class="muted">Family total</div><div id="familyTotal" class="big">$0.00</div></div><div class="card"><div class="muted">Your total</div><div id="myTotal" class="big">$0.00</div></div><div class="card"><div class="muted">Entries</div><div id="count" class="big">0</div></div></div>
<div class="two"><div class="card"><h3>Add expense</h3><input id="amount" type="number" min="0" step=".01" placeholder="Amount"><select id="category"><option>Food</option><option>Entertainment</option><option>Rent</option><option>Purchases</option><option>Other</option></select><input id="note" placeholder="Note (optional)"><input id="date" type="date"><button id="addBtn">Add expense</button></div><div class="card"><h3>Family expenses</h3><select id="filter"><option>All</option><option>Food</option><option>Entertainment</option><option>Rent</option><option>Purchases</option><option>Other</option></select><table><thead><tr><th>Person</th><th>Category</th><th>Amount</th><th>Date</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>
const FAMILY_PIN="2468"; let user=""; const key="usFamBudgetExpenses";
const $=id=>document.getElementById(id); $("date").value=new Date().toISOString().slice(0,10);
function login(){const n=$("name").value.trim(),p=$("pin").value;if(!n||p!==FAMILY_PIN){$("err").textContent="Enter your name and the correct family PIN.";return}user=n;$("login").classList.add("hidden");$("app").classList.remove("hidden");$("hello").textContent="Signed in as "+user;render()}
function logout(){user="";$("app").classList.add("hidden");$("login").classList.remove("hidden");$("pin").value=""}
function getData(){try{return JSON.parse(localStorage.getItem(key)||"[]")}catch{return[]}} function saveData(x){localStorage.setItem(key,JSON.stringify(x))}
function addExpense(){const a=parseFloat($("amount").value);if(!(a>0))return;const x=getData();x.unshift({id:Date.now(),person:user,amount:a,category:$("category").value,note:$("note").value,date:$("date").value});saveData(x);$("amount").value="";$("note").value="";render()}
function removeExpense(id){const x=getData(),e=x.find(v=>v.id===id);if(e&&e.person===user){saveData(x.filter(v=>v.id!==id));render()}}
function money(n){return Number(n).toLocaleString("en-US",{style:"currency",currency:"USD"})}function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){const all=getData(),f=$("filter").value,shown=f==="All"?all:all.filter(e=>e.category===f);$("familyTotal").textContent=money(all.reduce((s,e)=>s+e.amount,0));$("myTotal").textContent=money(all.filter(e=>e.person===user).reduce((s,e)=>s+e.amount,0));$("count").textContent=all.length;$("rows").innerHTML=shown.map(e=>`<tr><td>${esc(e.person)}</td><td>${esc(e.category)}</td><td>${money(e.amount)}</td><td>${esc(e.date)}</td><td>${e.person===user?`<button class="del" data-id="${e.id}">Delete</button>`:""}</td></tr>`).join("");document.querySelectorAll(".del").forEach(b=>b.onclick=()=>removeExpense(Number(b.dataset.id)))}
$("enterBtn").onclick=login;$("logoutBtn").onclick=logout;$("addBtn").onclick=addExpense;$("filter").onchange=render;$("pin").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
</script></body></html>

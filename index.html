<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>US FAM BUDGET</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e7eaf0;border-radius:16px;padding:18px;margin-bottom:14px}.login{max-width:390px;margin:12vh auto}.hidden{display:none!important}h1,h3{margin-top:0}.muted{color:#687386}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.big{font-size:27px;font-weight:780;margin-top:6px}header,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}input,select,button{padding:11px;border-radius:10px;border:1px solid #d9deea;font:inherit;background:#fff}input,select{width:100%;margin-top:8px}button{background:#172033;color:#fff;border:0;font-weight:700;cursor:pointer}.secondary{background:#fff;color:#172033;border:1px solid #d9deea}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form .wide{grid-column:1/-1}.edit-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;grid-column:1/-1}.editing{border:2px solid #2563eb}table{width:100%;border-collapse:collapse;margin-top:10px}td,th{text-align:left;padding:10px 5px;border-bottom:1px solid #edf0f5;font-size:14px}.action{background:none;width:auto;padding:4px 7px}.edit{color:#2563eb}.del{color:#b42318}.wheel{width:230px;height:230px;border-radius:50%;background:#e9edf3;margin:18px auto;position:relative}.wheel:after{content:"";position:absolute;inset:30%;border-radius:50%;background:#fff}.analysis{display:grid;grid-template-columns:280px 1fr;gap:20px}.legend{display:grid;gap:7px}.legend-row{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center}.dot{width:10px;height:10px;border-radius:50%}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.analysis{grid-template-columns:1fr}.form{grid-template-columns:1fr}.form .wide,.edit-actions{grid-column:auto}header{align-items:flex-start;flex-direction:column}table{display:block;overflow:auto}}@media(max-width:460px){.grid{grid-template-columns:1fr}}</style></head><body><div id="login" class="wrap login"><div class="card"><h1>US FAM BUDGET</h1><p class="muted">Enter your personal access code</p><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit access code"><button id="enter" style="width:100%;margin-top:10px">Enter dashboard</button><p id="err" class="muted"></p></div></div><main id="app" class="wrap hidden"><header><div><h1>US FAM BUDGET</h1><span id="hello" class="muted"></span></div><div class="row"><select id="period"></select><button id="logout" class="secondary">Log out</button></div></header><div class="grid"><div class="card"><div class="muted">Omar spent</div><div id="omarTotal" class="big">$0.00</div></div><div class="card"><div class="muted">Eiad spent</div><div id="eiadTotal" class="big">$0.00</div></div><div class="card"><div class="muted">Combined total</div><div id="combinedTotal" class="big">$0.00</div></div><div class="card"><div class="muted">Transactions</div><div id="count" class="big">0</div></div></div><section class="card analysis"><div><h3>Family spending breakdown</h3><div id="wheel" class="wheel"></div></div><div><h3>Categories</h3><div id="legend" class="legend"></div></div></section><section id="addCard" class="card"><h3 id="formTitle">Add expense</h3><p id="editNotice" class="muted hidden">Edit the fields below, then save your changes.</p><div class="form"><input id="amount" type="number" min="0" step=".01" placeholder="Amount ($)"><select id="category"></select><input id="note" placeholder="Description / merchant"><input id="date" type="date"><button id="add" class="wide">Add expense</button><div id="editActions" class="edit-actions hidden"><button id="saveEdit">Save changes</button><button id="cancelEdit" class="secondary">Cancel</button></div></div></section><section class="card"><div class="row"><h3>Transactions</h3><select id="filter" style="max-width:190px"></select></div><table><thead><tr><th>Person</th><th>Category</th><th>Amount</th><th>Date</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const ACCESS={'2711':'Omar','1359':'Eiad','3142':'Samer'},key='usFamBudgetExpenses';let user='',editingId=null;const $=id=>document.getElementById(id);const cats=['Food & Dining','Rent & Housing','Tuition','Transportation','Gas & Fuel','Car & Maintenance','Shopping & Purchases','Entertainment','Utilities','Phone & Internet','Insurance','Healthcare','Travel','Subscriptions','Personal Care','Gifts','Fees & Payments','Other'];const aliases={Food:'Food & Dining',Rent:'Rent & Housing',Tuition:'Tuition','Tuition & Education':'Tuition',Purchases:'Shopping & Purchases',Bills:'Utilities'};const colors=['#2563eb','#16a34a','#9333ea','#ea580c','#0891b2','#dc2626','#ca8a04','#64748b','#4f46e5','#059669','#c026d3','#e11d48','#0284c7','#65a30d','#d97706','#7c3aed','#475569','#0f766e'];const same=(a,b)=>String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();const cat=c=>aliases[c]||c||'Other';const money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'});function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}$('date').value=today();cats.forEach(c=>$('category').add(new Option(c,c)));$('filter').add(new Option('All categories','All'));cats.forEach(c=>$('filter').add(new Option(c,c)));[['all','All time'],['this','This month'],['last','Last month'],['year','This year']].forEach(o=>$('period').add(new Option(o[1],o[0])));function getData(){try{let x=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function save(x){localStorage.setItem(key,JSON.stringify(x))}function login(){user=ACCESS[$('pin').value]||'';if(!user){$('err').textContent='Incorrect access code.';return}$('err').textContent='';$('login').classList.add('hidden');$('app').classList.remove('hidden');$('hello').textContent=user==='Samer'?'Signed in as Samer · View only':'Signed in as '+user;$('addCard').classList.toggle('hidden',user==='Samer');render()}function periodData(all){let p=$('period').value,now=new Date(),ym=d=>String(d||'').slice(0,7);if(p==='all')return all;if(p==='year')return all.filter(e=>String(e.date||'').startsWith(now.getFullYear()+'-'));if(p==='last'){let d=new Date(now.getFullYear(),now.getMonth()-1,1),v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return all.filter(e=>ym(e.date)===v)}let v=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');return all.filter(e=>ym(e.date)===v)}function clearForm(){editingId=null;$('amount').value='';$('note').value='';$('date').value=today();$('category').selectedIndex=0;$('formTitle').textContent='Add expense';$('editNotice').classList.add('hidden');$('add').classList.remove('hidden');$('editActions').classList.add('hidden');$('addCard').classList.remove('editing')}function addExpense(){if(user==='Samer')return;let a=parseFloat($('amount').value);if(!(a>0)||!$('date').value)return;let x=getData();x.unshift({id:Date.now(),person:user,amount:a,category:$('category').value,note:$('note').value,date:$('date').value});save(x);clearForm();render()}function editExpense(id){if(user==='Samer')return;let e=getData().find(v=>v.id===id);if(!e||!same(e.person,user))return;editingId=id;$('amount').value=e.amount;$('category').value=cat(e.category);$('note').value=e.note||'';$('date').value=e.date||today();$('formTitle').textContent='Edit expense';$('editNotice').classList.remove('hidden');$('add').classList.add('hidden');$('editActions').classList.remove('hidden');$('addCard').classList.add('editing');$('addCard').scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>$('amount').focus(),350)}function saveEdit(){if(editingId===null||user==='Samer')return;let x=getData(),i=x.findIndex(e=>e.id===editingId);if(i<0||!same(x[i].person,user))return;let a=parseFloat($('amount').value);if(!(a>0)||!$('date').value)return alert('Enter a valid amount and date.');x[i]={...x[i],amount:a,category:$('category').value,note:$('note').value,date:$('date').value};save(x);clearForm();render()}function del(id){if(user==='Samer')return;let x=getData(),e=x.find(v=>v.id===id);if(e&&same(e.person,user)&&confirm('Delete this expense?')){save(x.filter(v=>v.id!==id));if(editingId===id)clearForm();render()}}function draw(data){let vals=cats.map(c=>data.filter(e=>cat(e.category)===c).reduce((s,e)=>s+Number(e.amount||0),0)),total=vals.reduce((a,b)=>a+b,0),start=0,parts=[];if(!total){$('wheel').style.background='#e9edf3';$('legend').innerHTML='<span class="muted">No spending in this period.</span>';return}vals.forEach((v,i)=>{if(v){let end=start+v/total*360;parts.push(colors[i]+' '+start+'deg '+end+'deg');start=end}});$('wheel').style.background='conic-gradient('+parts.join(',')+')';$('legend').innerHTML=cats.map((c,i)=>vals[i]?'<div class="legend-row"><span class="dot" style="background:'+colors[i]+'"></span><span>'+c+'</span><strong>'+money(vals[i])+'</strong></div>':'').join('')}function render(){let data=periodData(getData()),f=$('filter').value,shown=f==='All'?data:data.filter(e=>cat(e.category)===f),omar=data.filter(e=>same(e.person,'Omar')).reduce((s,e)=>s+Number(e.amount||0),0),eiad=data.filter(e=>same(e.person,'Eiad')).reduce((s,e)=>s+Number(e.amount||0),0);$('omarTotal').textContent=money(omar);$('eiadTotal').textContent=money(eiad);$('combinedTotal').textContent=money(omar+eiad);$('count').textContent=data.length;draw(data);$('rows').innerHTML=shown.map(e=>'<tr><td>'+e.person+'</td><td>'+cat(e.category)+'</td><td><strong>'+money(e.amount)+'</strong></td><td>'+e.date+'</td><td>'+(user!=='Samer'&&same(e.person,user)?'<button class="action edit" data-edit="'+e.id+'">Edit</button><button class="action del" data-del="'+e.id+'">Delete</button>':'')+'</td></tr>').join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editExpense(Number(b.dataset.edit)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(Number(b.dataset.del)))}$('enter').onclick=login;$('logout').onclick=()=>location.reload();$('add').onclick=addExpense;$('saveEdit').onclick=saveEdit;$('cancelEdit').onclick=clearForm;$('period').onchange=render;$('filter').onchange=render;$('pin').onkeydown=e=>{if(e.key==='Enter')login()};</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>US FAM BUDGET</title>
<style>:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:23px;margin:0}.muted{color:#687386}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border-radius:17px;padding:18px;box-shadow:0 5px 22px #17203310}.big{font-size:28px;font-weight:760;margin-top:6px}.two{display:grid;grid-template-columns:1fr 1.7fr;gap:14px;margin-top:14px}.analysis{display:grid;grid-template-columns:1fr 1.2fr;gap:22px;align-items:center;margin-top:14px}.wheel{width:min(260px,80vw);aspect-ratio:1;border-radius:50%;margin:12px auto;position:relative;background:#e9edf3}.wheel:after{content:"";position:absolute;inset:29%;border-radius:50%;background:white}.legend{display:grid;gap:9px}.legend-row{display:grid;grid-template-columns:14px 1fr auto;gap:9px;align-items:center;font-size:14px}.dot{width:12px;height:12px;border-radius:50%}input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid #d9deea;margin-top:8px;font:inherit}button{background:#172033;color:#fff;border:0;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:10px}td,th{text-align:left;padding:10px 5px;border-bottom:1px solid #edf0f5;font-size:14px}.del{width:auto;background:none;color:#b42318;padding:4px}.login{max-width:390px;margin:12vh auto}.hidden{display:none}.notice{font-size:12px;margin-top:12px;color:#687386}@media(max-width:720px){.grid,.two,.analysis{grid-template-columns:1fr}.wrap{padding:16px}table{display:block;overflow-x:auto}}</style></head><body>
<div id="login" class="wrap login"><div class="card"><h1>US FAM BUDGET</h1><p class="muted">Private family budget</p><input id="name" placeholder="Your name"><input id="pin" type="password" placeholder="Family PIN"><button id="enterBtn">Enter</button><p id="err" class="muted"></p><p class="notice">Starter version: data is saved on this browser. Shared family syncing will be connected next.</p></div></div>
<div id="app" class="wrap hidden"><header><div><h1>US FAM BUDGET</h1><span id="hello" class="muted"></span></div><button id="logoutBtn" style="width:auto">Log out</button></header>
<div class="grid"><div class="card"><div class="muted">Family total</div><div id="familyTotal" class="big">$0.00</div></div><div class="card"><div class="muted">Your total</div><div id="myTotal" class="big">$0.00</div></div><div class="card"><div class="muted">Entries</div><div id="count" class="big">0</div></div></div>
<div class="card analysis"><div><h3>Spending by category</h3><div id="wheel" class="wheel"></div></div><div><div class="muted">Your spending breakdown</div><div id="legend" class="legend"></div></div></div>
<div class="two"><div class="card"><h3>Add expense</h3><input id="amount" type="number" min="0" step=".01" placeholder="Amount"><select id="category"><option>Food</option><option>Rent</option><option>Tuition</option><option>Entertainment</option><option>Purchases</option><option>Transportation</option><option>Bills</option><option>Other</option></select><input id="note" placeholder="Note (optional)"><input id="date" type="date"><button id="addBtn">Add expense</button></div><div class="card"><h3>Family expenses</h3><select id="filter"><option>All</option><option>Food</option><option>Rent</option><option>Tuition</option><option>Entertainment</option><option>Purchases</option><option>Transportation</option><option>Bills</option><option>Other</option></select><table><thead><tr><th>Person</th><th>Category</th><th>Amount</th><th>Date</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>const FAMILY_PIN="2468",key="usFamBudgetExpenses";let user="";const $=id=>document.getElementById(id),cats=["Food","Rent","Tuition","Entertainment","Purchases","Transportation","Bills","Other"],colors=["#2563eb","#16a34a","#9333ea","#ea580c","#0891b2","#dc2626","#ca8a04","#64748b"];$('date').value=new Date().toISOString().slice(0,10);function login(){let n=$('name').value.trim();if(!n||$('pin').value!==FAMILY_PIN){$('err').textContent='Enter your name and the correct family PIN.';return}user=n;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('hello').textContent='Signed in as '+user;render()}function logout(){user='';$('app').classList.add('hidden');$('login').classList.remove('hidden');$('pin').value=''}function getData(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}}function saveData(x){localStorage.setItem(key,JSON.stringify(x))}function addExpense(){let a=parseFloat($('amount').value);if(!(a>0))return;let x=getData();x.unshift({id:Date.now(),person:user,amount:a,category:$('category').value,note:$('note').value,date:$('date').value});saveData(x);$('amount').value='';$('note').value='';render()}function removeExpense(id){let x=getData(),e=x.find(v=>v.id===id);if(e&&e.person===user){saveData(x.filter(v=>v.id!==id));render()}}function money(n){return Number(n).toLocaleString('en-US',{style:'currency',currency:'USD'})}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function drawWheel(data){let mine=data.filter(e=>e.person===user),vals=cats.map(c=>mine.filter(e=>e.category===c).reduce((s,e)=>s+e.amount,0)),total=vals.reduce((a,b)=>a+b,0),start=0,parts=[];if(!total){$('wheel').style.background='#e9edf3';$('legend').innerHTML='<span class="muted">Add expenses to see your category totals.</span>';return}vals.forEach((v,i)=>{if(v){let end=start+v/total*360;parts.push(`${colors[i]} ${start}deg ${end}deg`);start=end}});$('wheel').style.background=`conic-gradient(${parts.join(',')})`;$('legend').innerHTML=cats.map((c,i)=>vals[i]?`<div class="legend-row"><span class="dot" style="background:${colors[i]}"></span><span>${c}</span><strong>${money(vals[i])} · ${Math.round(vals[i]/total*100)}%</strong></div>`:'').join('')}function render(){let all=getData(),f=$('filter').value,shown=f==='All'?all:all.filter(e=>e.category===f);$('familyTotal').textContent=money(all.reduce((s,e)=>s+e.amount,0));$('myTotal').textContent=money(all.filter(e=>e.person===user).reduce((s,e)=>s+e.amount,0));$('count').textContent=all.length;drawWheel(all);$('rows').innerHTML=shown.map(e=>`<tr><td>${esc(e.person)}</td><td>${esc(e.category)}</td><td>${money(e.amount)}</td><td>${esc(e.date)}</td><td>${e.person===user?`<button class="del" data-id="${e.id}">Delete</button>`:''}</td></tr>`).join('');document.querySelectorAll('.del').forEach(b=>b.onclick=()=>removeExpense(Number(b.dataset.id)))}$('enterBtn').onclick=login;$('logoutBtn').onclick=logout;$('addBtn').onclick=addExpense;$('filter').onchange=render;$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
